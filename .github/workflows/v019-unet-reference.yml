name: AE v0.19 independent U-Net reference
on:
  push:
    branches: [feat/full-unet-resnet34-v019]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned independent reference libraries
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install segmentation-models-pytorch==0.6.0
      - name: Record original source and FX / Runtime graphs
        env:
          OMP_NUM_THREADS: '1'
        run: python scripts/audit_unet_reference.py
      - name: Upload independent reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-v019-unet-reference
          path: benchmark-output/unet-reference/
