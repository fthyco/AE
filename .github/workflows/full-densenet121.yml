name: AE full DenseNet121 forward gate

on:
  push:
    branches: [feat/full-densenet121-v018, main]
  pull_request:
  workflow_dispatch:

jobs:
  densenet121-full-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch runtime and AE
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,render]'
      - name: Full regression
        run: python -m pytest -q
      - name: Independent source, FX, runtime and SVG/PDF/TikZ gate
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONHASHSEED: '19'
        run: python scripts/verify_full_densenet121.py --output benchmark-output/full-densenet121
      - name: Deterministic IR across hash seeds
        env:
          PYTHONHASHSEED: '991'
        run: |
          ae extract benchmark-output/full-densenet121/input_64/source \
            --entrypoint densenet:densenet121 --input-shape 1,3,64,64 \
            --output benchmark-output/full-densenet121/seed991
          cmp benchmark-output/full-densenet121/input_64/sae/instance-forward.json \
              benchmark-output/full-densenet121/seed991/instance-forward.json
          cmp benchmark-output/full-densenet121/input_64/sae/architecture.ir.json \
              benchmark-output/full-densenet121/seed991/architecture.ir.json
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-v018-densenet121-forward
          path: benchmark-output/full-densenet121/
          if-no-files-found: warn
