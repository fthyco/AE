name: AE v0.25 external research and visualizer benchmark

on:
  push:
    branches: [feat/phase2-research-generalization-v025, main]
  pull_request:
    paths:
      - 'scripts/benchmark_external_research.py'
      - 'scripts/compare_visualizers_v025.py'
      - 'docs/phase2-research-benchmark.md'
      - '.github/workflows/research-generalization-v025.yml'
      - 'src/**'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  pinned-source-research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: ae
      - uses: actions/checkout@v4
        with:
          repository: fthyco/Adaptive-Width-Neural-Networks-WITH-ORDERING-GUIDENCE
          ref: e75ff0959a3b21ff997c393a26711e23745e96c7
          path: external/awn
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: fthyco/maia3
          ref: 853785c4a8a512b6b2181520bfef21ff1a74566f
          path: external/maia-act
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: fthyco/maia3
          ref: f9f66ed3feb7ab5a4498472d708c426ca8914436
          path: external/maia-cah
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Architecture Extractor without ML runtimes
        working-directory: ae
        run: python -m pip install -e '.[dev,render]'
      - name: Audited original AWN and Chessformer source-only extraction
        working-directory: ae
        env:
          PYTHONHASHSEED: '17'
          OMP_NUM_THREADS: '1'
        run: |
          python scripts/benchmark_external_research.py --case awn --source ../external/awn --output benchmark-output/phase2/awn
          python scripts/benchmark_external_research.py --case chessformer-act --source ../external/maia-act --output benchmark-output/phase2/chessformer-act
          python scripts/benchmark_external_research.py --case chessformer-cah --source ../external/maia-cah --output benchmark-output/phase2/chessformer-cah
      - name: Upload sanitized summaries ONLY (no upstream source or AE bundles)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-v025-research-source-only-summary
          path: ae/benchmark-output/phase2/**/summary.json
          if-no-files-found: warn

  comparative-visualizers:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install audited model, AE and comparison tools
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,render]' torchview==0.2.7 torchviz==0.0.3 visualtorch==1.4.1 graphviz
      - name: Run independent FX gate then record other tool outputs
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python scripts/verify_full_resnet18.py
          python scripts/compare_visualizers_v025.py --output benchmark-output/phase2/visualizers
      - name: Upload original independently generated comparison artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-v025-comparative-tools
          path: benchmark-output/phase2/visualizers/
          if-no-files-found: warn
