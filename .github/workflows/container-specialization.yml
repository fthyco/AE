name: AE container specialization acceptance

on:
  push:
    branches: [feat/container-specialization-v012, main]
  pull_request:
  workflow_dispatch:

jobs:
  dense-containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch CPU and AE
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,render]'
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Check original DenseNet variants against FX and module inventory
        env:
          PYTHONHASHSEED: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python scripts/verify_container_specialization.py
      - name: Upload IR, diagrams, and source verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-densenet-container-specialization
          path: benchmark-output/
          if-no-files-found: warn
