name: AE nested shapes and FX verification

on:
  push:
    branches: [feat/nested-shapes-fx-v014, main]
  pull_request:
  workflow_dispatch:

jobs:
  nested-shapes-fx:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent CPU runtime
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,render]'
      - name: Regression
        run: python -m pytest -q
      - name: Compare SAE to FX and ShapeProp
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONHASHSEED: '1'
        run: |
          for model in fixture nested_composite resnet18 resnet50 densenet121; do
            python scripts/verify_fx_correspondence.py "$model" --output benchmark-output/fx-ae
          done
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-v014-fx-source-site-evidence
          path: benchmark-output/fx-ae/
          if-no-files-found: warn
