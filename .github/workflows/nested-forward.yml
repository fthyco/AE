name: AE nested forward acceptance

on:
  push:
    branches: [feat/nested-forward-resolution]
  pull_request:
  workflow_dispatch:

jobs:
  original-models:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU dependencies and AE
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install segmentation-models-pytorch==0.6.0
          python -m pip install -e '.[dev,render]'
      - name: Regression tests
        run: python -m pytest -q
      - name: Verify unchanged DenseNet and U-Net sources
        run: python scripts/verify_nested_real_models.py
        env:
          PYTHONHASHSEED: '3'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          AE_NESTED_OUTPUT: benchmark-output
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-nested-densenet-unet-reference
          path: benchmark-output/
          if-no-files-found: warn
