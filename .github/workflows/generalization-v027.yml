name: AE v0.27 generic source hierarchy, optional runtime reference and browser gate

on:
  push:
    branches: [feat/v027-generic-hierarchy-runtime-audit, main]
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/benchmark_external_research.py'
      - 'scripts/verify_v027_browser.py'
      - 'tests/test_v027_generalization_runtime.py'
      - 'docs/v027-generalization.md'
      - '.github/workflows/generalization-v027.yml'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  generic-research-source:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: ae
      - uses: actions/checkout@v4
        with:
          repository: fthyco/Adaptive-Width-Neural-Networks-WITH-ORDERING-GUIDENCE
          ref: e75ff0959a3b21ff997c393a26711e23745e96c7
          path: original/awn
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: fthyco/maia3
          ref: 853785c4a8a512b6b2181520bfef21ff1a74566f
          path: original/maia-act
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: fthyco/maia3
          ref: f9f66ed3feb7ab5a4498472d708c426ca8914436
          path: original/maia-cah
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install source-only AE (no torch / target dependencies)
        working-directory: ae
        run: |
          python -m pip install -e '.[dev,render]'
          python - <<'PY'
          import importlib.util as u
          assert u.find_spec('torch') is None
          PY
      - name: Unit tests for generic hierarchies and no-execution default
        working-directory: ae
        run: python -m pytest -q tests/test_v027_generalization_runtime.py
      - name: Original AWN and Chessformer three-level structure audits
        working-directory: ae
        env:
          PYTHONHASHSEED: '101'
        run: |
          python scripts/benchmark_external_research.py --case awn --source ../original/awn --output benchmark-output/v027/awn
          python scripts/benchmark_external_research.py --case chessformer-act --source ../original/maia-act --output benchmark-output/v027/chessformer-act
          python scripts/benchmark_external_research.py --case chessformer-cah --source ../original/maia-cah --output benchmark-output/v027/chessformer-cah
      - name: Upload summaries only - upstream AWN source is not redistributed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-v027-three-level-original-research-summaries
          path: ae/benchmark-output/v027/**/summary.json
          if-no-files-found: warn

  optional-fx-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned CPU torch for isolated OPT-IN execution reference
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,render]'
      - name: Validate safe-by-default and traced/unsupported reference paths
        run: python -m pytest -q tests/test_v027_generalization_runtime.py
      - name: Reference original local residual CNN, without claiming AE runtime parity
        run: |
          ae runtime-audit examples/cnn_residual_mvp --factory model:CNN --input-shape 1,3,64,64 --allow-execute --output benchmark-output/v027/fx-residual
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('benchmark-output/v027/fx-residual')
          summary=json.loads((root/'runtime-audit-summary.json').read_text())
          assert summary['status']=='traced'
          assert summary['fx_nodes']>=8
          assert summary['fx_operand_edges']>=7
          assert summary['ae_static_equivalence']=='not_verified'
          assert summary['runtime_output']['shape']==[1,2]
          PY
      - name: Upload synthetic-input runtime reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-v027-optin-fx-reference
          path: benchmark-output/v027/fx-residual/
          if-no-files-found: warn

  interactive-chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install AE and Playwright
        run: |
          python -m pip install -e '.[dev,render]'
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate offline DOM interactions and source-identity drill-down
        run: python scripts/verify_v027_browser.py
      - name: Upload viewer browser screenshot and audit (no private model)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-v027-chromium-audit
          path: |
            benchmark-output/v027-browser/browser-report.json
            benchmark-output/v027-browser/offline-viewer-v027.png
          if-no-files-found: warn
