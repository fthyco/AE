name: Generate verified AE README gallery

on:
  push:
    branches: [docs/readme-visual-gallery-v027]
    paths:
      - 'README.md'
      - 'scripts/generate_readme_gallery.py'
      - '.github/workflows/readme-gallery-v027.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned reference, AE and Chromium
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,render]' playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Independently verify VGG16 and render actual AE output
        run: python -m scripts.generate_readme_gallery
      - name: Verify README references
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          text=Path('README.md').read_text()
          base=Path('docs/assets/readme')
          report=json.loads((base/'gallery-manifest.json').read_text())
          assert report['fx_operations']==42 and report['ordered_dependencies']==41
          for name in report['gallery']:
              assert (base/name).stat().st_size>100
              assert 'docs/assets/readme/'+name in text
          PY
      - name: Commit original verified images
        if: github.ref_name == 'docs/readme-visual-gallery-v027'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/assets/readme/
          if ! git diff --cached --quiet; then
            git commit -m 'docs: add verified VGG16 diagrams and offline viewer screenshot'
            git push origin HEAD:docs/readme-visual-gallery-v027
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ae-readme-gallery-v027
          path: docs/assets/readme/
          if-no-files-found: warn
