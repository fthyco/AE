name: AE composite shape verification

on:
  push:
    branches: [feat/composite-shapes-v013, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned PyTorch CPU
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,render]'
      - name: Unit tests
        run: python -m pytest -q
      - name: Independent FX and runtime shape agreement
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONHASHSEED: '4'
        run: python scripts/verify_composite_shapes.py
      - name: Upload original source and verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-composite-shape-evidence
          path: benchmark-output/composite-v013/
          if-no-files-found: warn
