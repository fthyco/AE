name: AE instance-aware FX audit

on:
  push:
    branches: [feat/instance-aware-fx-v015, main]
  pull_request:
  workflow_dispatch:

jobs:
  instance-correspondence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime and AE
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,render]'
      - name: Run tests
        run: python -m pytest -q
      - name: Compare instance-aware FX graphs
        env:
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          PYTHONHASHSEED: '11'
        run: |
          python scripts/verify_fx_instances.py --output benchmark-output/fx-instances
      - name: Upload instance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-v015-instance-correspondence
          path: benchmark-output/fx-instances/
          if-no-files-found: warn
