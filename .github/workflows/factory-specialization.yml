name: AE factory specialization acceptance

on:
  push:
    branches: [feat/factory-specialization]
  pull_request:
  workflow_dispatch:

jobs:
  real-resnet-factories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install TorchVision CPU and AE
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,render]'
      - name: Regression tests
        run: python -m pytest -q
      - name: Verify unmodified ResNet factories
        run: python scripts/verify_resnet_factories.py
        env:
          PYTHONHASHSEED: '1'
          OMP_NUM_THREADS: '1'
          AE_FACTORY_OUTPUT: benchmark-output
      - name: Publish source-backed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-resnet18-resnet50-factory-reference
          path: benchmark-output/
          if-no-files-found: warn
