name: AE v0.22 full MobileNetV3 Small forward gate

on:
  push:
    branches: [feat/full-mobilenetv3-small-v022, main]
  pull_request:
  workflow_dispatch:

jobs:
  original-mobilenetv3-small:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AE_REQUIRE_MNV3_PIN: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact original CPU model and AE
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev,render]'
      - name: Original FX and actual hooks vs AE source-only full acceptance
        run: python scripts/verify_full_mobilenetv3_small_v022.py --output benchmark-output/mobilenetv3-small-v022
      - name: All unit and regression tests (source pins mandatory)
        run: python -m pytest -q
      - name: Assert SAE does not import or run target package
        run: |
          python - <<'PYCODE'
          import builtins
          from pathlib import Path
          original=builtins.__import__
          def reject_import(name,*args,**kwargs):
              if name.split('.')[0] in ('torch','torchvision','timm'):
                  raise AssertionError('Model package imported by SAE: '+name)
              return original(name,*args,**kwargs)
          builtins.__import__=reject_import
          from ae.sae.api import extract
          root=Path('benchmark-output/mobilenetv3-small-v022')
          extract(root/'source',root/'without-target-import',
                  entrypoint='torchvision.models.mobilenetv3:mobilenet_v3_small',
                  input_shape=(1,3,224,224))
          PYCODE
      - name: Compare canonical static IR across hash seeds
        env:
          PYTHONHASHSEED: '991'
        run: |
          ae extract benchmark-output/mobilenetv3-small-v022/source \
            --entrypoint torchvision.models.mobilenetv3:mobilenet_v3_small \
            --input-shape 1,3,224,224 --output benchmark-output/mobilenetv3-small-v022/hash991
          cmp benchmark-output/mobilenetv3-small-v022/1x3x224x224/ae-bundle/instance-forward.json \
              benchmark-output/mobilenetv3-small-v022/hash991/instance-forward.json
          cmp benchmark-output/mobilenetv3-small-v022/1x3x224x224/ae-bundle/architecture.ir.json \
              benchmark-output/mobilenetv3-small-v022/hash991/architecture.ir.json
      - name: Extraction wall time and peak memory
        run: |
          /usr/bin/time -f 'wall_seconds=%e\npeak_rss_kib=%M' \
            -o benchmark-output/mobilenetv3-small-v022/performance.txt \
            ae extract benchmark-output/mobilenetv3-small-v022/source \
              --entrypoint torchvision.models.mobilenetv3:mobilenet_v3_small \
              --input-shape 1,3,224,224 --output benchmark-output/mobilenetv3-small-v022/profiled
      - name: Upload original FX and model-independent AE proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-v022-full-mobilenetv3-small
          path: benchmark-output/mobilenetv3-small-v022/
          if-no-files-found: warn
