name: AE v0.20 full timm ViT-Tiny forward acceptance gate

on:
  push:
    branches: [feat/full-vit-tiny-v020, main]
  pull_request:
  workflow_dispatch:

jobs:
  full-vit-tiny:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AE_REQUIRE_VIT_PIN: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install original model, fixed runtime and AE
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install timm==1.0.22
          python -m pip install -e '.[dev,render]'
      - name: Independent FX, hooks, shapes, and vector figure gate
        env:
          PYTHONHASHSEED: '19'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python scripts/verify_full_vit_tiny_v020.py --output benchmark-output/vit-tiny-v020
      - name: Full local regression tests
        run: python -m pytest -q
      - name: Assert no timm or torch import during AE source-only extraction
        run: |
          python - <<'PYCODE'
          import builtins
          from pathlib import Path
          original=builtins.__import__
          def safe_import(name,*a,**kw):
              if name.split('.')[0] in ('torch','torchvision','timm'):
                  raise RuntimeError('AE imported prohibited target package: '+name)
              return original(name,*a,**kw)
          builtins.__import__=safe_import
          from ae.sae.api import extract
          extract(Path('benchmark-output/vit-tiny-v020/source'),
                  Path('benchmark-output/vit-tiny-v020/no-target-import'),
                  entrypoint='timm.models.vision_transformer:vit_tiny_patch16_224',
                  input_shape=(1,3,224,224), attention_mode='fused')
          PYCODE
      - name: Static IR deterministic across hash seeds
        env:
          PYTHONHASHSEED: '991'
        run: |
          ae extract benchmark-output/vit-tiny-v020/source --entrypoint timm.models.vision_transformer:vit_tiny_patch16_224 --attention-mode fused --input-shape 1,3,224,224 --output benchmark-output/vit-tiny-v020/seed991
          cmp benchmark-output/vit-tiny-v020/fused-1x3x224x224/ae-bundle/instance-forward.json benchmark-output/vit-tiny-v020/seed991/instance-forward.json
          cmp benchmark-output/vit-tiny-v020/fused-1x3x224x224/ae-bundle/architecture.ir.json benchmark-output/vit-tiny-v020/seed991/architecture.ir.json
      - name: Measure isolated extraction time and RSS
        run: |
          /usr/bin/time -f 'wall_seconds=%e\npeak_rss_kib=%M' -o benchmark-output/vit-tiny-v020/extractor-performance.txt \
            ae extract benchmark-output/vit-tiny-v020/source --entrypoint timm.models.vision_transformer:vit_tiny_patch16_224 --attention-mode fused --input-shape 1,3,224,224 --output benchmark-output/vit-tiny-v020/profiled
      - name: Upload audit and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ae-v020-full-vit-tiny
          path: benchmark-output/vit-tiny-v020/
          if-no-files-found: warn
