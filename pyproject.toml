[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-executer"
version = "0.9.0"
description = "Static source-grounded neural architecture extraction and visualization"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "AE contributors"}]
license = {text = "MIT"}
keywords = ["pytorch", "static-analysis", "architecture", "intermediate-representation"]
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4", "reportlab>=4"]
render = ["reportlab>=4"]

[project.scripts]
ae = "ae.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
